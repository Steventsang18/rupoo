[package]
name = "rupoo"
version = "0.3.1"
edition = "2021"
authors = ["Steventsang18"]
description = "AI-powered Terminal Assistant — native REPL with plan execution, memory, and MCP support"
repository = "https://github.com/Steventsang18/rupoo"
license = "MIT"
keywords = ["ai", "agent", "repl", "llm", "plan-execution"]
categories = ["command-line-utilities", "artificial-intelligence"]

[features]
default = []
gui = ["egui", "eframe", "open", "tray-icon"]

[dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
async-trait = "0.1"
rig-core = "0.30"
futures = "0.3"
crossbeam-channel = "0.5"
unicode-width = "0.2"
rustyline = "15"
owo-colors = "4"
syntect = "5"
indicatif = "0.17"
ctrlc = "3"
egui = { version = "0.27", optional = true }
tray-icon = { version = "0.24", optional = true }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
eframe = { version = "0.27", features = ["default"], optional = true }
open = { version = "5", optional = true }
console = "0.15"
which = "8.0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
urlencoding = "2"
toml = "0.8"
path_jail = "0.3"
once_cell = "1.19"
lru = "0.12"
serde_yaml = "0.9"

[package.metadata.bundle]
name = "Rupoo"
identifier = "com.plan-executor.agent"
icon = []
version = "0.3.1"
category = "Developer Tools"
short_description = "AI-powered plan execution agent"
long_description = "A desktop AI assistant with plan execution, memory, and skills management."
copyright = "Copyright 2026"
departments = []
minimum_system_version = "11.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
