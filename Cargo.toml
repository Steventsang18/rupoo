[workspace]
members = ["src-agent", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.0"
authors = ["Steventsang18"]
license = "MIT"
edition = "2021"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
