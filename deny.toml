# cargo-deny configuration for Rupoo
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
yanked = "deny"
notice = "warn"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
]
copyleft = "warn"
default = "deny"
confidence-threshold = 0.8
exceptions = [
    # Allow ring's license (ISC + OpenSSL)
    { name = "ring", allow = ["ISC", "OpenSSL"] },
    # Allow unicode-ident's license
    { name = "unicode-ident", allow = ["MIT", "Apache-2.0", "Unicode-3.0"] },
    { name = "unicode-width", allow = ["MIT", "Apache-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow some commonly duplicated crates
skip = [
    # Common duplicates in the ecosystem
    { name = "bitflags", version = "1" },
    { name = "syn", version = "1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
