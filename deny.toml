# cargo-deny configuration for Rupoo
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Since cargo-deny 0.16 the vulnerability/unmaintained/unsound/notice
# fields were removed: all advisory types are denied by default, which is
# the desired policy here. Only yanked/ignore remain configurable.
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    # Fonts shipped by egui (epaint_default_fonts)
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    # notify (file watching) is public-domain style
    "CC0-1.0",
    # webpki-roots data license
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Allow ring's license (ISC + OpenSSL)
    { name = "ring", allow = ["ISC", "OpenSSL"] },
    # Allow unicode-ident's license
    { name = "unicode-ident", allow = ["MIT", "Apache-2.0", "Unicode-3.0"] },
    { name = "unicode-width", allow = ["MIT", "Apache-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Allow some commonly duplicated crates
skip = [
    # Common duplicates in the ecosystem
    { name = "bitflags", version = "1" },
    { name = "syn", version = "1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
