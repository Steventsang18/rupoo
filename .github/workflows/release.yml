# Build and release rupoo CLI binaries for multiple platforms.
# Triggered by pushing a version tag (e.g., v0.5.0).
#
# NOTE: Only builds the `rupoo` CLI (src-agent), NOT `rupoo-tauri`
# (which requires platform-specific SDKs for desktop GUI).

name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-apple-darwin
            # macos-13 is Intel-native; avoids ARM64→x86_64
            # cross-compile issues with brew's ARM64-only OpenSSL.
            os: macos-13
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install openssl
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y pkg-config libssl-dev
          fi

      - name: Build release binary (rupoo only)
        run: cargo build --release --package rupoo --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C link-arg=-s"

      - name: Prepare archive
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/rupoo${{ matrix.ext }}"
          ARCHIVE="rupoo-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext == '.exe' && '.zip' || '.tar.gz' }}"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "$ARCHIVE" "$BINARY"
          else
            tar czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          generate_release_notes: false
