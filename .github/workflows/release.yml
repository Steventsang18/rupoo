# Build and release rupoo CLI binaries for multiple platforms.
# Triggered by pushing a version tag (e.g., v0.5.0).
#
# NOTE: Only builds the `rupoo` CLI (src-agent), NOT `rupoo-tauri`
# (which requires platform-specific SDKs for desktop GUI).

name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
          - target: x86_64-apple-darwin
            # macos-13 is Intel-native; avoids ARM64→x86_64
            # cross-compile issues with brew's ARM64-only OpenSSL.
            os: macos-13
            ext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install openssl
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y pkg-config libssl-dev
          fi

      - name: Build release binary (rupoo only)
        run: cargo build --release --package rupoo --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C link-arg=-s"

      - name: Prepare archive
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/rupoo${{ matrix.ext }}"
          ARCHIVE="rupoo-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext == '.exe' && '.zip' || '.tar.gz' }}"
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "$ARCHIVE" "$BINARY"
          else
            tar czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          fi
          # Publish a SHA-256 checksum next to each artifact so installers
          # (scripts/install.sh, scripts/install.ps1) can verify integrity.
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          generate_release_notes: false

      # macOS notarization is enabled only when Apple signing secrets are
      # configured on the repository; otherwise the unsigned build ships as-is.
      - name: Notarize macOS binaries (conditional)
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "notarize placeholder: configure APPLE_ID/APPLE_PASSWORD secrets to enable"
        shell: bash

      # Windows code-signing is enabled only when a signing cert is configured.
      - name: Sign Windows binary (conditional)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          echo "signtool placeholder: configure WINDOWS_CERTIFICATE secret to enable"
        shell: bash

  gui:
    name: GUI (macOS)
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable

      - name: Install dependencies (root tauri CLI + frontend)
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir src-ui install --frozen-lockfile

      - name: Build & bundle GUI
        run: pnpm tauri build

      - name: Prepare DMG + checksum
        shell: bash
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          ARCH=$(uname -m)
          ASSET="rupoo-gui-${{ github.ref_name }}-${ARCH}.dmg"
          mv "$DMG" "$ASSET"
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "dmg=$ASSET" >> "$GITHUB_OUTPUT"
        id: package-gui

      - name: Upload GUI release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package-gui.outputs.dmg }}
            ${{ steps.package-gui.outputs.dmg }}.sha256
          generate_release_notes: false
