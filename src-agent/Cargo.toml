[package]
name = "rupoo"
version = "0.6.3"
edition = "2021"
authors = ["Steventsang18"]
description = "AI-powered Terminal Assistant — native REPL with plan execution, memory, and MCP support"
repository = "https://github.com/Steventsang18/rupoo"
license = "MIT"
keywords = ["ai", "agent", "repl", "llm", "plan-execution"]
categories = ["command-line-utilities", "artificial-intelligence"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "process", "net", "io-std", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
async-trait = "0.1"
rig-core = "0.30"
seahash = "4"
indexmap = "2"
futures = "0.3"
crossbeam-channel = "0.5"
unicode-width = "0.2"
crossterm = "0.28"
owo-colors = "4"
indicatif = "0.17"
console = "0.15"
ratatui = "0.29"
which = "8.0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
urlencoding = "2"
toml = "0.8"
path_jail = "0.3"
once_cell = "1.19"
lru = "0.12"
parking_lot = "0.12"
cron = "0.13"
serde_yaml = "0.9"
flate2 = "1"
tar = "0.4"
keyring = { version = "2", optional = true }
eframe = { version = "0.29", optional = true }

# Channel (Feishu/DingTalk/WeCom)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

# Ops & security (added in 0.7.0)
miette = { version = "7", features = ["fancy"] }
self_update = { version = "0.41", features = ["archive-tar", "compression-flate2", "archive-zip", "rustls"] }
aes-gcm = "0.10"
zeroize = "1"
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.13"
notify = "8"

[features]
default = ["keyring"]
gui = ["eframe"]

[dev-dependencies]
tempfile = "3"
bencher = "0.1"
rand = "0.8"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async", "html_reports"] }
http-body-util = "0.1"

[lints.clippy]
cognitive_complexity = "allow"
similar_names = "warn"
unnested_or_patterns = "warn"
